[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koeln-luft"
version = "0.1.0"
description = "Streamlit-Dashboard zur Luftqualität und zum Wetter in Köln 2025"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# dict(...) ist bei Plotly-Layouts gut lesbar
ignore = ["C408"]

[tool.ruff.lint.isort]
known-first-party = ["koeln_luft", "shared"]
